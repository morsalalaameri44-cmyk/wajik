name: Build Customer App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Application
        run: |
          npm install --legacy-peer-deps || (cd apps/customer && npm install --legacy-peer-deps)
          cd apps/customer
          npm run build

      - name: Setup Capacitor & Generate Android Project
        run: |
          cd apps/customer
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "SpeedGoCustomer" "com.speedgo.customer" --web-dir dist
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: Build APK via Gradle
        run: |
          cd apps/customer/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedGo-Customer-APK
          path: apps/customer/android/app/build/outputs/apk/debug/app-debug.apk
