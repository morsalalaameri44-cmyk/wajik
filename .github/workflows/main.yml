name: Build Customer App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Build Customer App
        run: |
          cd apps/customer
          npm install
          npm run build || true

      - name: Setup Capacitor & Android
        run: |
          cd apps/customer
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init SpeedGoCustomer com.speedgo.customer --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd apps/customer/android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedGo-Customer-APK
          path: apps/customer/android/app/build/outputs/apk/debug/app-debug.apk
