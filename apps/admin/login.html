<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Speed Go Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #F25C05; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0F172A; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #1E293B; width: 90%; max-width: 400px; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .logo-box { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 28px; margin: 0 auto 15px auto; box-shadow: 0 4px 15px rgba(242,92,5,0.4); }
        .form-input { width: 100%; padding: 14px 16px; background: #0F172A; border: 1px solid #334155; border-radius: 12px; color: white; font-size: 15px; margin-bottom: 15px; outline: none; transition: 0.2s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(242,92,5,0.2); }
        .login-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(242,92,5,0.3); }
        .login-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon logo-box"><i class="fa-solid fa-bolt"></i></div>
        <h2 style="color: white; font-weight: 900; font-size: 22px; margin-bottom: 5px;">Speed Go Ops</h2>
        <p style="color: #94A3B8; font-size: 13px; margin-bottom: 25px;">بوابة الدخول المحمية للإدارة</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="email" id="loginEmail" class="form-input" placeholder="البريد الإلكتروني للإدارة..." required dir="ltr" style="text-align:right;">
            <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور..." required dir="ltr" style="text-align:right;">
            <button type="submit" class="login-btn" id="submitBtn">تسجيل الدخول</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWZheGlyZ3J1cXVseGhrYXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjI1MjEsImV4cCI6MjA5OTAzODUyMX0.WyCwILEemzN0z5UOTd4aVC6YCxmXHTyAKcai00CJtvw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('submitBtn');

            btn.innerText = 'جاري التحقق...';
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // التحقق والتوجيه الناجح
                window.location.replace('index.html');
            } catch (err) {
                alert('فشل تسجيل الدخول: ' + err.message);
                btn.innerText = 'تسجيل الدخول';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
