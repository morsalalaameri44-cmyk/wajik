<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Go Ops - غرفة العمليات المركزية</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05; --bg-color: #F8FAFC; --sidebar-bg: #1E293B;
            --sidebar-hover: #334155; --sidebar-text: #CBD5E1; --card-bg: #FFFFFF;
            --text-dark: #0F172A; --text-gray: #64748B; --border: #E2E8F0;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444; --info: #3B82F6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; position: relative; }

        /* القائمة الجانبية */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; transition: 0.3s ease-in-out; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; position: relative; }
        .close-sidebar-btn { display: none; position: absolute; left: 15px; top: 25px; color: white; background: none; border: none; font-size: 20px; cursor: pointer; }
        .logo-icon { width: 40px; height: 40px; background-color: var(--primary); color: white; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .brand-name { color: white; font-size: 20px; font-weight: 900; }
        .brand-sub { color: var(--sidebar-text); font-size: 11px; font-weight: 500; }
        .nav-menu { flex: 1; padding: 20px 0; overflow-y: auto; }
        .nav-group { margin-bottom: 25px; }
        .nav-group-title { color: #64748B; font-size: 11px; font-weight: 800; padding: 0 25px; margin-bottom: 10px; text-transform: uppercase; }
        
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 25px; color: var(--sidebar-text); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; border-right: 3px solid transparent; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background-color: var(--sidebar-hover); color: white; border-right-color: var(--primary); }
        .nav-link i { width: 20px; font-size: 16px; text-align: center; }
        
        .badge { margin-right: auto; background-color: var(--danger); color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 800; }
        
        /* تنسيق بروفایل الموظف وزر الخروج */
        .user-profile { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 12px; }
        .user-profile-top { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 38px; height: 38px; background: #CBD5E1; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--text-dark); font-weight: 800; }
        .user-info h4 { color: white; font-size: 13px; font-weight: 700; }
        .user-info p { color: var(--sidebar-text); font-size: 11px; }
        .logout-btn-admin { width: 100%; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logout-btn-admin:hover { background: rgba(239, 68, 68, 0.2); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: 0.3s; }

        /* منطقة المحتوى */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
        .top-navbar { height: 70px; background-color: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); flex-shrink: 0; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .menu-toggle-btn { display: none; background: none; border: none; font-size: 24px; color: var(--text-dark); cursor: pointer; }
        .page-title { font-size: 18px; font-weight: 800; color: var(--text-dark); }
        .top-actions { display: flex; gap: 10px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background-color: var(--bg-color); border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; color: var(--text-gray); cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: #E2E8F0; color: var(--text-dark); }
        .workspace { flex: 1; padding: 20px; overflow-y: auto; background-color: #F1F5F9; }

        /* تصميمات البطاقات والجداول */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        .order-card-pro {
            background: #FFFFFF; border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); border: 1px solid #E2E8F0;
            display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden;
        }
        .order-card-pro::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 5px; }
        .status-new::before { background: var(--info); }
        .status-processing::before { background: var(--warning); }
        .status-delivering::before { background: var(--primary); }

        .order-header-pro { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F1F5F9; padding-bottom: 12px; }
        .order-id-pro { font-weight: 900; font-size: 18px; color: #0F172A; }
        .badge-pro { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }
        .badge-new { background: #EFF6FF; color: #2563EB; }
        .badge-processing { background: #FEF3C7; color: #D97706; }
        .badge-delivering { background: rgba(242,92,5,0.1); color: var(--primary); }

        .info-row-pro { display: flex; align-items: center; gap: 12px; color: #475569; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .info-row-pro i { color: #64748B; width: 24px; text-align: center; }

        .order-summary-box { background: #F1F5F9; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .order-total-pro { font-weight: 900; color: #059669; font-size: 17px; }

        .btn-pro { flex: 1; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; color: #FFF; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-accept { background: var(--warning); }
        .btn-deliver { background: var(--info); }
        .btn-pro:active { transform: scale(0.97); }

        /* التجاوب للجوال */
        @media (max-width: 768px) {
            .sidebar { position: fixed; right: -260px; height: 100%; }
            .sidebar.active { right: 0; }
            .overlay.active { display: block; opacity: 1; }
            .menu-toggle-btn { display: block; }
            .close-sidebar-btn { display: block; }
            .workspace { padding: 15px; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- القائمة الجانبية -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="close-sidebar-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
            <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
            <div>
                <div class="brand-name">Speed Go Ops</div>
                <div class="brand-sub">غرفة العمليات المركزية</div>
            </div>
        </div>

        <nav class="nav-menu">
            <div class="nav-group">
                <div class="nav-group-title">العمليات والطلبات</div>
                <a class="nav-link active" id="nav-live_orders" onclick="navigateTo('live_orders', 'الطلبات الحية')">
                    <i class="fa-solid fa-satellite-dish"></i> الطلبات الحية <span class="badge" id="newOrdersCount">0</span>
                </a>
            </div>

            <div class="nav-group">
                <div class="nav-group-title">الشركاء واللوجستيات</div>
                <a class="nav-link" id="nav-stores" onclick="navigateTo('stores', 'إدارة المطاعم')">
                    <i class="fa-solid fa-store"></i> إدارة المطاعم
                </a>
                <a class="nav-link" id="nav-drivers" onclick="navigateTo('drivers', 'إدارة المناديب')">
                    <i class="fa-solid fa-motorcycle"></i> إدارة المناديب
                </a>
            </div>
        </nav>
        
        <!-- بروفايل المدير مع حماية الجلسة واسم الموظف وزر الخروج -->
        <div class="user-profile">
            <div class="user-profile-top">
                <div class="avatar"><i class="fa-solid fa-user-shield"></i></div>
                <div class="user-info">
                    <h4 id="adminNameDisplay">جاري التحقق...</h4>
                    <p>موظف عمليات معتمد</p>
                </div>
            </div>
            <button class="logout-btn-admin" onclick="logoutAdmin()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
            </button>
        </div>
    </aside>

    <!-- منطقة المحتوى الرئيسية -->
    <main class="main-content">
        <header class="top-navbar">
            <div class="header-right">
                <button class="menu-toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="page-title" id="pageTitle">الطلبات الحية</div>
            </div>
            <div class="top-actions">
                <button class="icon-btn" onclick="refreshCurrentView()" title="تحديث"><i class="fa-solid fa-arrows-rotate"></i></button>
            </div>
        </header>

        <div class="workspace" id="workspaceContent"></div>
    </main>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWZheGlyZ3J1cXVseGhrYXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjI1MjEsImV4cCI6MjA5OTAzODUyMX0.WyCwILEemzN0z5UOTd4aVC6YCxmXHTyAKcai00CJtvw';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentView = 'live_orders';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // --- نظام الحماية والمصادقة (Auth Guard) ---
        async function checkAuth() {
            const { data: { session }, error } = await window.supabaseClient.auth.getSession();
            if (error || !session) {
                // إذا لم يكن المدير مسجلاً، يتم توجيهه فورا لصفحة تسجيل الدخول
                window.location.replace('login.html');
                return false;
            }
            
            // استخراج اسم المستخدم من البريد الإلكتروني وعرضه في القائمة الجانبية
            const email = session.user.email;
            const displayName = email.split('@')[0];
            const nameEl = document.getElementById('adminNameDisplay');
            if(nameEl) nameEl.innerText = displayName;
            
            return true;
        }

        // دالة تسجيل الخروج للموظف
        async function logoutAdmin() {
            await window.supabaseClient.auth.signOut();
            window.location.replace('login.html');
        }

        // نظام التوجيه (Router) البسيط والذكي
        function navigateTo(viewName, title) {
            currentView = viewName;
            document.getElementById('pageTitle').innerText = title;
            
            // تحديث الأزرار النشطة في القائمة
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const activeLink = document.getElementById(`nav-${viewName}`);
            if(activeLink) activeLink.classList.add('active');

            // إغلاق القائمة الجانبية في الجوال عند الاختيار
            if(window.innerWidth <= 768) toggleSidebar();

            loadViewContent();
        }

        function refreshCurrentView() {
            loadViewContent();
        }

        async function loadViewContent() {
            const container = document.getElementById('workspaceContent');
            container.innerHTML = '<div style="text-align:center; padding:50px;"><i class="fa-solid fa-spinner fa-spin" style="font-size:30px; color:var(--primary);"></i><p style="margin-top:10px; color:var(--text-gray);">جاري التحميل...</p></div>';

            if (currentView === 'live_orders') {
                if (window.renderLiveOrders) window.renderLiveOrders(container);
            } else if (currentView === 'stores') {
                if (window.renderStores) window.renderStores(container);
            } else if (currentView === 'drivers') {
                if (window.renderDrivers) window.renderDrivers(container);
            }
        }

        // عداد الطلبات الجديدة في القائمة الجانبية
        async function updateNewOrdersBadge() {
            try {
                const { count, error } = await window.supabaseClient
                    .from('orders')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'new');
                
                if (!error) {
                    const badge = document.getElementById('newOrdersCount');
                    badge.innerText = count || 0;
                    badge.style.display = count > 0 ? 'inline-block' : 'none';
                }
            } catch(e) { console.error(e); }
        }

        // تشغيل التحقق الأمني عند تحميل الصفحة
        window.onload = async () => {
            const isAuthenticated = await checkAuth();
            if (!isAuthenticated) return; // توقف التنفيذ إذا لم يكن مسجلاً

            loadViewContent();
            updateNewOrdersBadge();

            // الاستماع الفوري للتغييرات لتحديث العداد تلقائياً
            window.supabaseClient
                .channel('admin_badge_channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                    updateNewOrdersBadge();
                })
                .subscribe();
        };
    </script>

    <!-- استدعاء ملفات الأقسام -->
    <script src="js/views/live_orders.js"></script>
    <script src="js/views/stores.js"></script>
    <script src="js/views/drivers.js"></script>
</body>
</html>
