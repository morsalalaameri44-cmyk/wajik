<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تأكيد الطلب - واجيك</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-light: #FFF2EB;
            --bg-light: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-gray: #757575;
            --success: #2A9D8F;
            --danger: #E63946;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            --border-color: #EFEFEF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E9ECEF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-light);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .header {
            background-color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            width: 35px;
            height: 35px;
            background-color: var(--bg-light);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 16px;
        }

        .header h2 { font-size: 17px; font-weight: 800; color: var(--text-dark); }

        .checkout-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section-card {
            background-color: white;
            border-radius: 18px;
            padding: 15px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            border: 1px solid #FAFAFA;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .section-title i { color: var(--primary); font-size: 16px; }

        .customer-input {
            width: 100%;
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .customer-input:focus {
            border-color: var(--primary);
            background-color: white;
        }

        .address-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .address-info h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); }
        .address-info p { font-size: 12px; color: var(--text-gray); margin-top: 4px; }
        .change-link { font-size: 12px; font-weight: 700; color: var(--primary); cursor: pointer; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 15px;
        }
        .cart-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .item-details { flex: 1; }
        .item-details h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); margin-bottom: 5px; }
        .item-details .price { font-size: 14px; font-weight: 900; color: var(--primary); }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            background-color: var(--bg-light);
            border-radius: 10px;
            padding: 4px;
        }
        .qty-btn {
            width: 28px; height: 28px;
            background-color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .qty-btn:active { transform: scale(0.95); }
        .qty-number {
            width: 30px;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
        }

        .delete-btn {
            color: var(--danger);
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
        }

        .order-notes {
            width: 100%;
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-dark);
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        .order-notes:focus {
            border-color: var(--primary);
            background-color: white;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            margin-bottom: 10px;
        }
        .invoice-row.total {
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-bottom: 0;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-dark);
        }
        .invoice-row.total .total-price { color: var(--primary); font-size: 18px; font-weight: 900; }

        .footer-action {
            padding: 15px 20px 25px 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
        }
        .submit-btn {
            width: 100%; padding: 15px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 14px;
            font-size: 15px; font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(242, 92, 5, 0.2);
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            background-color: #CCC;
            box-shadow: none;
            cursor: not-allowed;
        }

        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); z-index: 100;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s ease-in-out;
        }
        .success-overlay.show { opacity: 1; visibility: visible; }
        .success-card {
            width: 80%; background-color: white; border-radius: 24px;
            padding: 30px 20px; text-align: center; transform: scale(0.8);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-overlay.show .success-card { transform: scale(1); }
        .success-icon-box {
            width: 70px; height: 70px; background-color: rgba(42, 157, 143, 0.1);
            color: var(--success); font-size: 32px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto;
        }
        .success-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: var(--text-dark); }
        .success-card p { font-size: 13px; color: var(--text-gray); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <a href="store.html" class="back-btn"><i class="fa-solid fa-chevron-right"></i></a>
            <h2>تأكيد طلبك</h2>
        </header>

        <main class="checkout-content no-scrollbar">
            
            <div class="section-card">
                <div class="section-title">
                    <i class="fa-solid fa-user"></i>
                    <span>بيانات المستلم</span>
                </div>
                <input type="text" id="customerName" class="customer-input" placeholder="الاسم الكريم (مثال: أمجد)">
                <input type="tel" id="customerPhone" class="customer-input" placeholder="رقم الجوال (مثال: 77XXXXXXX)">
            </div>

            <div class="section-card">
                <div class="section-title">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>عنوان التوصيل</span>
                </div>
                <div class="address-detail">
                    <div class="address-info">
                        <h4>المنزل (عدن - خورمكسر)</h4>
                        <p>بجانب جولة البجعة - عمارة رقم 12، الدور الثاني</p>
                    </div>
                    <span class="change-link">تغيير</span>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span>مراجعة الأصناف</span>
                </div>
                <div id="cartItemsContainer"></div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>ملاحظات للمطعم (اختياري)</span>
                </div>
                <textarea id="orderNotes" class="order-notes" rows="3" placeholder="مثال: بدون بصل، زيادة شطة، أو أي تعليمات خاصة..."></textarea>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <i class="fa-solid fa-receipt"></i>
                    <span>ملخص الحساب</span>
                </div>
                
                <div class="invoice-row">
                    <span id="subtotalLabel">إجمالي الأصناف</span>
                    <span id="subtotalValue">0 ر.ي</span>
                </div>
                
                <div class="invoice-row">
                    <span>رسوم التوصيل</span>
                    <span>500 ر.ي</span>
                </div>

                <div class="invoice-row total">
                    <span>المبلغ الإجمالي</span>
                    <span class="total-price" id="totalValue">0 ر.ي</span>
                </div>
            </div>

        </main>

        <footer class="footer-action">
            <button id="submitOrderBtn" class="submit-btn" onclick="processOrder()">تأكيد وإرسال الطلب</button>
        </footer>

        <!-- نافذة النجاح -->
        <div class="success-overlay" id="successOverlay">
            <div class="success-card">
                <div class="success-icon-box">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3>تم إرسال طلبك بنجاح!</h3>
                <p>جاري نقلك لصفحة طلباتك...</p>
            </div>
        </div>

    </div>

    <!-- 🟢 إضافة مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. إعداد الاتصال بقاعدة البيانات (بمفتاحك الحقيقي)
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'sb_publishable_Gsn2xn5DjAJehY0SGFubzw_KxV-hG-4'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let cartItems = [];
        const deliveryFee = 500;

        // جلب البيانات من الذاكرة
        function loadCartFromMemory() {
            const savedCart = localStorage.getItem('wajik_cart');
            if (savedCart) {
                const rawItems = JSON.parse(savedCart);
                let grouped = {};
                
                rawItems.forEach(item => {
                    if(grouped[item.name]) {
                        grouped[item.name].qty += 1;
                    } else {
                        grouped[item.name] = { name: item.name, price: item.price, qty: 1 };
                    }
                });
                
                cartItems = Object.values(grouped);
            }
            renderCart();
        }

        function syncMemory() {
            let flatCart = [];
            cartItems.forEach(item => {
                for(let i=0; i<item.qty; i++) {
                    flatCart.push({name: item.name, price: item.price});
                }
            });
            localStorage.setItem('wajik_cart', JSON.stringify(flatCart));
        }

        function renderCart() {
            const container = document.getElementById("cartItemsContainer");
            const subtotalLabel = document.getElementById("subtotalLabel");
            const subtotalValue = document.getElementById("subtotalValue");
            const totalValue = document.getElementById("totalValue");
            const submitBtn = document.getElementById("submitOrderBtn");

            container.innerHTML = "";
            let subtotal = 0;
            let totalItems = 0;

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: var(--text-gray); padding: 20px 0;">
                        <i class="fa-solid fa-basket-shopping" style="font-size: 30px; margin-bottom: 10px; opacity: 0.5;"></i>
                        <p>سلتك فارغة، يبدو أنك لم تختر شيئاً بعد!</p>
                    </div>`;
                submitBtn.disabled = true;
                subtotalLabel.innerText = `إجمالي الأصناف`;
                subtotalValue.innerText = `0 ر.ي`;
                totalValue.innerText = `0 ر.ي`;
                return;
            }

            submitBtn.disabled = false;

            cartItems.forEach((item, index) => {
                subtotal += (item.price * item.qty);
                totalItems += item.qty;

                const itemHTML = `
                    <div class="cart-item">
                        <div class="item-details">
                            <h4>${item.name}</h4>
                            <div class="price">${(item.price * item.qty).toLocaleString()} ر.ي</div>
                        </div>
                        <div class="item-actions">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                                <div class="qty-number">${item.qty}</div>
                                <button class="qty-btn" onclick="updateQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                            </div>
                            <button class="delete-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });

            subtotalLabel.innerText = `إجمالي الأصناف (${totalItems} صنف)`;
            subtotalValue.innerText = `${subtotal.toLocaleString()} ر.ي`;
            totalValue.innerText = `${(subtotal + deliveryFee).toLocaleString()} ر.ي`;
        }

        function updateQty(index, change) {
            cartItems[index].qty += change;
            if (cartItems[index].qty <= 0) {
                removeItem(index);
            } else {
                syncMemory();
                renderCart();
            }
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            syncMemory();
            renderCart();
        }

        // 🟢 الدالة لإرسال الطلب إلى السحابة بعد التحقق من تسجيل الدخول
        async function processOrder() {
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;

            if(!customerName || !customerPhone) {
                alert("عفواً، يرجى إدخال اسمك ورقم جوالك لتأكيد الطلب.");
                return;
            }

            // التحقق من هوية المستخدم
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                alert("يجب عليك تسجيل الدخول أولاً لإتمام الطلب!");
                window.location.href = 'index.html'; 
                return;
            }

            const submitBtn = document.getElementById("submitOrderBtn");
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الطلب...';

            let subtotal = 0;
            cartItems.forEach(item => subtotal += (item.price * item.qty));
            const totalAmount = subtotal + deliveryFee;

            // تجهيز حزمة البيانات
            const newOrderData = {
                store_id: "9e1755d3-994c-49bb-b188-e3117b6260f4", 
                customer_id: user.id, 
                customer_name: customerName,
                customer_phone: customerPhone,
                subtotal_amount: subtotal, 
                total_amount: totalAmount,
                delivery_fee: deliveryFee,
                status: 'new', // ضبط الحالة إلى 'new' لتتوافق مع لوحة المشرف
                order_items: cartItems 
            };

            const { data, error } = await supabaseClient
                .from('orders')
                .insert([newOrderData]);

            if (error) {
                console.error("خطأ في الإرسال:", error);
                alert("سبب الرفض من السيرفر:\n" + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وإرسال الطلب";
                return;
            }

            // إظهار نافذة النجاح
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('show');
            
            // إفراغ السلة
            localStorage.removeItem('wajik_cart');
            localStorage.removeItem('wajik_total');

            // الانتقال لصفحة طلباتي
            setTimeout(() => {
                window.location.href = 'orders.html';
            }, 2000);
        }

        window.onload = loadCartFromMemory;
    </script>
</body>
</html>
