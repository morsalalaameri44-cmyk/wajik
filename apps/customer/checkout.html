<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تأكيد الطلب - Speed Go</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-glow: rgba(242, 92, 5, 0.3);
            --bg-body: #F4F6F9;
            --white: #FFFFFF;
            --text-dark: #121212;
            --text-gray: #7A8089;
            --success: #10B981;
            --danger: #EF4444;
            --card-shadow: 0 12px 35px rgba(0, 0, 0, 0.04);
            --border-light: #F0F2F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; max-height: 900px;
            background-color: var(--bg-body); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* الهيدر الزجاجي */
        .header {
            background: rgba(244, 246, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px; display: flex; align-items: center; gap: 15px;
            position: sticky; top: 0; z-index: 50;
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }

        .back-btn {
            width: 40px; height: 40px; background-color: var(--white);
            border-radius: 14px; display: flex; justify-content: center; align-items: center;
            color: var(--text-dark); text-decoration: none; font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.9); }

        .header h2 { font-size: 18px; font-weight: 900; color: var(--text-dark); }

        /* المحتوى الرئيسي */
        .checkout-content {
            flex: 1; overflow-y: auto; padding: 10px 20px 120px 20px;
        }

        /* البطاقات الأنيقة */
        .magic-card {
            background-color: var(--white); border-radius: 24px; padding: 20px;
            box-shadow: var(--card-shadow); margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.8);
            transition: transform 0.3s ease;
        }

        .section-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 15px; font-weight: 900; color: var(--text-dark); margin-bottom: 18px;
        }
        .section-title i {
            width: 32px; height: 32px; background: rgba(242, 92, 5, 0.1);
            color: var(--primary); border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
        }

        /* حقول الإدخال الاحترافية */
        .input-wrapper { position: relative; margin-bottom: 12px; }
        .input-wrapper i {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #A0AAB5; font-size: 16px; transition: 0.3s;
        }
        .customer-input {
            width: 100%; background-color: #F8FAFC; border: 1.5px solid transparent;
            border-radius: 16px; padding: 16px 45px 16px 16px;
            font-size: 14px; font-weight: 500; color: var(--text-dark); outline: none; transition: 0.3s;
        }
        .customer-input:focus {
            border-color: var(--primary); background-color: var(--white);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .customer-input:focus + i { color: var(--primary); }

        /* عنوان التوصيل */
        .address-box {
            display: flex; justify-content: space-between; align-items: center;
            background: #F8FAFC; padding: 15px; border-radius: 16px; border: 1px solid var(--border-light);
        }
        .address-info h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .address-info p { font-size: 12px; color: var(--text-gray); line-height: 1.4; }
        .change-link {
            font-size: 12px; font-weight: 800; color: var(--primary); background: rgba(242, 92, 5, 0.1);
            padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: 0.2s;
        }
        .change-link:active { transform: scale(0.95); }

        /* عناصر السلة */
        .cart-items-wrapper { display: flex; flex-direction: column; gap: 15px; }
        
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: var(--white); border-radius: 18px;
            border: 1px solid var(--border-light); transition: 0.3s ease;
            animation: slideIn 0.4s ease forwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .item-details { flex: 1; padding-left: 10px; }
        .item-details h4 { font-size: 14px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        .item-details .price { font-size: 15px; font-weight: 900; color: var(--primary); }

        .item-actions { display: flex; align-items: center; gap: 12px; }

        .qty-controls {
            display: flex; align-items: center; background-color: #F8FAFC;
            border-radius: 12px; padding: 4px; border: 1px solid var(--border-light);
        }
        .qty-btn {
            width: 30px; height: 30px; background-color: var(--white);
            border: none; border-radius: 10px; font-size: 14px; color: var(--text-dark);
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s;
        }
        .qty-btn:active { transform: scale(0.9); background: var(--primary); color: white; }
        .qty-number { width: 30px; text-align: center; font-size: 14px; font-weight: 900; }

        .delete-btn {
            width: 36px; height: 36px; background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger); border: none; border-radius: 12px;
            font-size: 14px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        .delete-btn:active { transform: scale(0.9); background: var(--danger); color: white; }

        /* الملاحظات */
        .order-notes {
            width: 100%; background-color: #F8FAFC; border: 1.5px solid transparent;
            border-radius: 16px; padding: 15px; font-size: 13px; color: var(--text-dark);
            resize: none; outline: none; transition: 0.3s; line-height: 1.5;
        }
        .order-notes:focus { border-color: var(--primary); background-color: var(--white); box-shadow: 0 0 0 4px var(--primary-glow); }

        /* الفاتورة الرقمية */
        .invoice-receipt {
            background: #F8FAFC; border-radius: 16px; padding: 20px;
            position: relative; border: 1px dashed #D1D5DB;
        }
        .invoice-receipt::before, .invoice-receipt::after {
            content: ''; position: absolute; top: 50%; width: 20px; height: 20px;
            background: var(--white); border-radius: 50%; transform: translateY(-50%);
        }
        .invoice-receipt::before { left: -10px; border-right: 1px dashed #D1D5DB; }
        .invoice-receipt::after { right: -10px; border-left: 1px dashed #D1D5DB; }

        .invoice-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; font-weight: 700; color: var(--text-gray); margin-bottom: 12px;
        }
        .invoice-row.total {
            border-top: 1px dashed #D1D5DB; padding-top: 15px; margin-bottom: 0;
            font-size: 16px; font-weight: 900; color: var(--text-dark);
        }
        .invoice-row.total .total-price { color: var(--primary); font-size: 20px; }

        /* الشريط العائم السفلي للتأكيد */
        .floating-footer {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 15px 20px 25px 20px; border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
        }

        .submit-btn {
            width: 100%; padding: 18px;
            background: linear-gradient(135deg, #FF6B35 0%, #F25C05 100%);
            color: white; border: none; border-radius: 18px;
            font-size: 16px; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 25px rgba(242, 92, 5, 0.3); transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .submit-btn:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(242, 92, 5, 0.2); }
        .submit-btn:disabled { background: #CBD5E1; box-shadow: none; cursor: not-allowed; }
        
        .btn-price-tag {
            background: rgba(255,255,255,0.2); padding: 4px 10px;
            border-radius: 10px; font-size: 14px;
        }

        /* شاشة النجاح الخرافية */
        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.4s ease-in-out;
        }
        .success-overlay.show { opacity: 1; visibility: visible; }
        
        .check-wrapper {
            width: 100px; height: 100px; background: var(--success);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 45px; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.3);
            transform: scale(0); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s;
        }
        .success-overlay.show .check-wrapper { transform: scale(1); animation: pulseSuccess 2s infinite; }
        
        @keyframes pulseSuccess {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .success-overlay h2 {
            font-size: 24px; font-weight: 900; color: var(--text-dark); margin-bottom: 10px;
            transform: translateY(20px); opacity: 0; transition: 0.4s ease 0.3s;
        }
        .success-overlay p {
            font-size: 14px; color: var(--text-gray); font-weight: 700;
            transform: translateY(20px); opacity: 0; transition: 0.4s ease 0.4s;
        }
        .success-overlay.show h2, .success-overlay.show p { transform: translateY(0); opacity: 1; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-chevron-right"></i></a>
            <h2>إتمام الطلب</h2>
        </header>

        <main class="checkout-content no-scrollbar">
            
            <div class="magic-card">
                <div class="section-title">
                    <i class="fa-solid fa-user-astronaut"></i>
                    <span>بيانات المستلم</span>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="customerName" class="customer-input" placeholder="الاسم الكريم (مثال: أمجد)">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-wrapper">
                    <input type="tel" id="customerPhone" class="customer-input" placeholder="رقم الجوال (مثال: 77XXXXXXX)">
                    <i class="fa-solid fa-phone"></i>
                </div>
            </div>

            <div class="magic-card">
                <div class="section-title">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>أين نوصل طلبك؟</span>
                </div>
                <div class="address-box">
                    <div class="address-info">
                        <h4>المنزل (عدن - خورمكسر)</h4>
                        <p>بجانب جولة البجعة - عمارة رقم 12، الدور الثاني</p>
                    </div>
                    <span class="change-link">تعديل</span>
                </div>
            </div>

            <div class="magic-card">
                <div class="section-title">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>محتويات السلة</span>
                </div>
                <div id="cartItemsContainer" class="cart-items-wrapper">
                    <!-- سيتم حقن العناصر هنا -->
                </div>
            </div>

            <div class="magic-card">
                <div class="section-title">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>تعليمات خاصة (اختياري)</span>
                </div>
                <textarea id="orderNotes" class="order-notes" rows="3" placeholder="بدون بصل؟ زيادة شطة؟ اكتب ما تريده هنا..."></textarea>
            </div>

            <div class="magic-card" style="background: transparent; box-shadow: none; padding: 0; border: none;">
                <div class="invoice-receipt">
                    <div class="invoice-row">
                        <span id="subtotalLabel">إجمالي الأصناف</span>
                        <span id="subtotalValue">0 ر.ي</span>
                    </div>
                    <div class="invoice-row">
                        <span>رسوم التوصيل السريع ⚡</span>
                        <span>500 ر.ي</span>
                    </div>
                    <div class="invoice-row total">
                        <span>المبلغ المطلوب</span>
                        <span class="total-price" id="totalValue">0 ر.ي</span>
                    </div>
                </div>
            </div>

        </main>

        <div class="floating-footer">
            <button id="submitOrderBtn" class="submit-btn" onclick="processOrder()">
                <span>تأكيد وإرسال الطلب</span>
                <span class="btn-price-tag" id="btnPriceTotal">0 ر.ي</span>
            </button>
        </div>

        <!-- شاشة النجاح الخرافية -->
        <div class="success-overlay" id="successOverlay">
            <div class="check-wrapper">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2>تم استلام طلبك! 🎉</h2>
            <p>سنقوم بتجهيزه وتوصيله بأسرع وقت ممكن.</p>
        </div>

    </div>

    <!-- 🟢 إضافة مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // إعداد الاتصال بقاعدة البيانات
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'sb_publishable_Gsn2xn5DjAJehY0SGFubzw_KxV-hG-4'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let cartItems = [];
        const deliveryFee = 500;

        // جلب البيانات من الذاكرة
        function loadCartFromMemory() {
            const savedCart = localStorage.getItem('speed_go_cart');
            if (savedCart) {
                const rawItems = JSON.parse(savedCart);
                let grouped = {};
                
                rawItems.forEach(item => {
                    if(grouped[item.name]) {
                        grouped[item.name].qty += 1;
                    } else {
                        grouped[item.name] = { name: item.name, price: item.price, qty: 1 };
                    }
                });
                
                cartItems = Object.values(grouped);
            }
            renderCart();
        }

        function syncMemory() {
            let flatCart = [];
            cartItems.forEach(item => {
                for(let i=0; i<item.qty; i++) {
                    flatCart.push({name: item.name, price: item.price});
                }
            });
            localStorage.setItem('speed_go_cart', JSON.stringify(flatCart));
        }

        function renderCart() {
            const container = document.getElementById("cartItemsContainer");
            const subtotalLabel = document.getElementById("subtotalLabel");
            const subtotalValue = document.getElementById("subtotalValue");
            const totalValue = document.getElementById("totalValue");
            const btnPriceTotal = document.getElementById("btnPriceTotal");
            const submitBtn = document.getElementById("submitOrderBtn");

            container.innerHTML = "";
            let subtotal = 0;
            let totalItems = 0;

            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px 0;">
                        <img src="https://cdn-icons-png.flaticon.com/512/11329/11329060.png" alt="Empty" style="width: 80px; opacity: 0.5; margin-bottom: 15px;">
                        <p style="color: var(--text-gray); font-weight: 700;">سلتك خفيفة جداً، أضف بعض المنتجات!</p>
                    </div>`;
                submitBtn.disabled = true;
                btnPriceTotal.innerText = `0 ر.ي`;
                subtotalValue.innerText = `0 ر.ي`;
                totalValue.innerText = `0 ر.ي`;
                return;
            }

            submitBtn.disabled = false;

            cartItems.forEach((item, index) => {
                subtotal += (item.price * item.qty);
                totalItems += item.qty;

                const itemHTML = `
                    <div class="cart-item">
                        <div class="item-details">
                            <h4>${item.name}</h4>
                            <div class="price">${(item.price * item.qty).toLocaleString()} ر.ي</div>
                        </div>
                        <div class="item-actions">
                            <button class="delete-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash-can"></i></button>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                                <div class="qty-number">${item.qty}</div>
                                <button class="qty-btn" onclick="updateQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });

            subtotalLabel.innerText = `إجمالي الأصناف (${totalItems})`;
            subtotalValue.innerText = `${subtotal.toLocaleString()} ر.ي`;
            
            const finalTotal = subtotal + deliveryFee;
            totalValue.innerText = `${finalTotal.toLocaleString()} ر.ي`;
            btnPriceTotal.innerText = `${finalTotal.toLocaleString()} ر.ي`;
        }

        function updateQty(index, change) {
            cartItems[index].qty += change;
            if (cartItems[index].qty <= 0) {
                removeItem(index);
            } else {
                syncMemory();
                renderCart();
            }
        }

        function removeItem(index) {
            cartItems.splice(index, 1);
            syncMemory();
            renderCart();
        }

        async function processOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const notes = document.getElementById('orderNotes').value.trim();

            if(!name || !phone) {
                alert("يرجى إدخال الاسم ورقم الجوال لتأكيد الطلب!");
                return;
            }

            if(cartItems.length === 0) {
                alert("سلتك فارغة!");
                return;
            }

            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>جاري إرسال الطلب...</span>';

            let subtotal = cartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let totalAmount = subtotal + deliveryFee;

            try {
                // الحصول على مستخدم Supabase الحالي إن وجد
                const { data: { user } } = await supabaseClient.auth.getUser();
                const customerId = user ? user.id : null;

                const { data, error } = await supabaseClient.from('orders').insert([
                    {
                        customer_id: customerId,
                        customer_name: name,
                        customer_phone: phone,
                        order_notes: notes,
                        order_items: cartItems,
                        total_amount: totalAmount,
                        status: 'new'
                    }
                ]).select();

                if(error) throw error;

                // إظهار شاشة النجاح
                document.getElementById('successOverlay').classList.add('show');
                localStorage.removeItem('speed_go_cart');

                setTimeout(() => {
                    window.location.href = 'orders.html';
                }, 2500);

            } catch(err) {
                console.error("Error submitting order:", err);
                alert("حدث خطأ أثناء إرسال الطلب، تأكد من الاتصال بالإنترنت.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>تأكيد وإرسال الطلب</span><span class="btn-price-tag">${totalAmount.toLocaleString()} ر.ي</span>`;
            }
        }

        window.onload = loadCartFromMemory;
    </script>
</body>
</html>
