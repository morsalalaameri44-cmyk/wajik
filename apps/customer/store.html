<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قائمة المتجر - واجيك</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-light: #FFF2EB;
            --bg-light: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-gray: #757575;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --border-color: #EFEFEF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E9ECEF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-light);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* =========================================
           1. الهيدر (Header)
           ========================================= */
        .header {
            background-color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn, .share-btn {
            width: 35px;
            height: 35px;
            background-color: var(--bg-light);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 16px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* =========================================
           2. معلومات المتجر
           ========================================= */
        .store-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .store-cover {
            height: 180px;
            background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .store-cover::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
        }

        .store-details-card {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            margin: -30px 15px 15px 15px;
            position: relative;
            z-index: 2;
            box-shadow: var(--card-shadow);
        }

        .store-details-card h1 { font-size: 20px; font-weight: 900; margin-bottom: 5px; color: var(--text-dark); }
        .store-details-card p { font-size: 13px; color: var(--text-gray); margin-bottom: 15px; }

        .store-stats {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .stat-item {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .stat-item i { color: var(--primary); margin-bottom: 5px; font-size: 16px; }

        /* =========================================
           3. قائمة الطعام (المنيو)
           ========================================= */
        .menu-section {
            padding: 10px 15px;
        }

        .menu-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .menu-item {
            background-color: white;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--card-shadow);
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .menu-item:active {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .item-info h3 { font-size: 15px; font-weight: 800; margin-bottom: 5px; color: var(--text-dark); }
        .item-info p { font-size: 12px; color: var(--text-gray); margin-bottom: 10px; }
        .item-price { font-size: 15px; font-weight: 900; color: var(--primary); }

        .add-btn {
            width: 40px;
            height: 40px;
            background-color: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.9); background-color: var(--primary); color: white; }

        /* =========================================
           4. شريط السلة العائم
           ========================================= */
        .floating-cart {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background-color: var(--primary);
            color: white;
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(242, 92, 5, 0.4);
            cursor: pointer;
            transition: 0.2s;
            z-index: 20;
            text-decoration: none;
        }

        .floating-cart:active { transform: scale(0.98); }

        .cart-info { display: flex; align-items: center; gap: 10px; }
        
        .cart-count {
            background-color: white;
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 14px;
        }

        .cart-total { font-size: 16px; font-weight: 800; }

        .checkout-text {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <a href="home.html" class="back-btn"><i class="fa-solid fa-chevron-right"></i></a>
            <h2>قائمة الطعام</h2>
            <div class="share-btn"><i class="fa-solid fa-share-nodes"></i></div>
        </header>

        <main class="store-content no-scrollbar">
            
            <div class="store-cover" id="storeCoverImage"></div>

            <div class="store-details-card">
                <h1 id="storeNameDisplay">جاري التحميل...</h1>
                <p id="storeCategoryDisplay">يرجى الانتظار، جاري جلب التفاصيل</p>
                <div class="store-stats">
                    <div class="stat-item">
                        <i class="fa-solid fa-star"></i><br>4.9 (جديد)
                    </div>
                    <div class="stat-item">
                        <i class="fa-solid fa-clock"></i><br>30-45 دقيقة
                    </div>
                    <div class="stat-item">
                        <i class="fa-solid fa-motorcycle"></i><br>توصيل سريع
                    </div>
                </div>
            </div>

            <div class="menu-section" id="menuList">
                <h2 class="menu-title">الأطباق الرئيسية</h2>
                
                <div style="text-align:center; padding:30px 10px; color:var(--text-gray);">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size:30px; margin-bottom:10px; color:var(--primary);"></i>
                    <p style="font-weight:700;">جاري جلب قائمة الطعام...</p>
                </div>
            </div>

        </main>

        <a href="checkout.html" class="floating-cart" id="floatingCart" style="display: none;">
            <div class="cart-info">
                <span class="cart-count" id="cartCountDisplay">0</span>
                <span class="cart-total" id="cartTotalDisplay">0 ر.ي</span>
            </div>
            <div class="checkout-text">
                إتمام الطلب <i class="fa-solid fa-chevron-left"></i>
            </div>
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="store.js"></script>

</body>
</html>
