<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حسابي - واجيك</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-light: #FFF2EB;
            --bg-light: #F8F9FA;
            --text-dark: #1A1A1A;
            --text-gray: #757575;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --nav-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            --danger: #E63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E9ECEF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-light);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* =========================================
           الهيدر ومعلومات المستخدم الشخصية
           ========================================= */
        .profile-header {
            background-color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            position: relative;
        }

        .edit-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 35px; height: 35px;
            background-color: var(--bg-light);
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-dark); text-decoration: none; font-size: 14px;
        }

        .user-avatar {
            width: 90px; height: 90px;
            background-color: var(--primary-light);
            background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(242, 92, 5, 0.2);
        }

        .profile-header h2 { font-size: 20px; font-weight: 900; color: var(--text-dark); margin-bottom: 5px; }
        .profile-header p { font-size: 14px; color: var(--text-gray); font-weight: 500; }

        /* =========================================
           بطاقة المحفظة ونقاط الولاء (تسويق)
           ========================================= */
        .wallet-card {
            background: linear-gradient(135deg, var(--primary) 0%, #D94F00 100%);
            border-radius: 20px;
            margin: -20px 20px 20px 20px;
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 25px rgba(242, 92, 5, 0.3);
        }

        .wallet-info h4 { font-size: 13px; font-weight: 500; opacity: 0.9; margin-bottom: 5px; }
        .wallet-info h2 { font-size: 22px; font-weight: 900; }
        
        .loyalty-points {
            background-color: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .loyalty-points i { color: #FFD166; margin-bottom: 3px; font-size: 18px; }
        .loyalty-points p { font-size: 11px; font-weight: 800; }

        /* =========================================
           قائمة الإعدادات
           ========================================= */
        .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px 20px;
        }

        .settings-group {
            background-color: white;
            border-radius: 20px;
            padding: 10px 15px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

        .settings-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #F0F0F0;
            text-decoration: none;
            color: var(--text-dark);
            transition: 0.2s;
        }

        .settings-item:last-child { border-bottom: none; }
        .settings-item:active { opacity: 0.7; }

        .item-icon {
            width: 40px; height: 40px;
            background-color: var(--bg-light);
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-gray); font-size: 16px; margin-left: 15px;
        }

        .item-text { flex: 1; font-size: 15px; font-weight: 700; }
        .item-arrow { color: #CCC; font-size: 14px; }

        .logout-btn {
            width: 100%;
            padding: 16px;
            background-color: rgba(230, 57, 70, 0.1);
            color: var(--danger);
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            cursor: pointer; margin-bottom: 20px;
            transition: 0.2s;
        }
        
        .logout-btn:active { transform: scale(0.98); }

        /* =========================================
           شريط التنقل السفلي الفعال
           ========================================= */
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 75px;
            background-color: #FFFFFF; border-top: 1px solid #EFEFEF;
            box-shadow: var(--nav-shadow); display: flex;
            justify-content: space-around; align-items: center; z-index: 10; padding: 0 10px;
        }

        .nav-link {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: var(--text-gray); text-decoration: none; font-size: 11px;
            font-weight: 700; cursor: pointer; transition: 0.2s; width: 60px;
        }
        .nav-link i { font-size: 20px; }
        .nav-link.active { color: var(--primary); }

        .cart-nav-link { position: relative; }
        .cart-badge {
            position: absolute; top: -5px; right: 12px; background-color: var(--primary); color: white;
            font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-weight: 800; border: 2px solid white;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الهيدر الشخصي -->
        <header class="profile-header">
            <a href="#" class="edit-btn"><i class="fa-solid fa-pen"></i></a>
            <!-- صورة رمزية للمستخدم (Avatar) -->
            <div class="user-avatar"></div>
            <h2>أمجد</h2>
            <p>+967 77X XXX XXX</p>
        </header>

        <!-- بطاقة المحفظة ونقاط الولاء -->
        <div class="wallet-card">
            <div class="wallet-info">
                <h4>رصيد المحفظة</h4>
                <h2>0.00 ر.ي</h2>
            </div>
            <div class="loyalty-points">
                <i class="fa-solid fa-crown"></i>
                <p>150 نقطة</p>
            </div>
        </div>

        <!-- محتوى الإعدادات -->
        <main class="profile-content no-scrollbar">
            
            <div class="settings-group">
                <a href="#" class="settings-item">
                    <div class="item-icon" style="color: var(--primary); background-color: var(--primary-light);"><i class="fa-solid fa-map-location-dot"></i></div>
                    <span class="item-text">عناويني المحفوظة</span>
                    <i class="fa-solid fa-chevron-left item-arrow"></i>
                </a>
                <a href="#" class="settings-item">
                    <div class="item-icon"><i class="fa-solid fa-credit-card"></i></div>
                    <span class="item-text">طرق الدفع</span>
                    <i class="fa-solid fa-chevron-left item-arrow"></i>
                </a>
                <a href="#" class="settings-item">
                    <div class="item-icon"><i class="fa-solid fa-bell"></i></div>
                    <span class="item-text">الإشعارات</span>
                    <i class="fa-solid fa-chevron-left item-arrow"></i>
                </a>
            </div>

            <div class="settings-group">
                <a href="#" class="settings-item">
                    <div class="item-icon"><i class="fa-solid fa-headset"></i></div>
                    <span class="item-text">مركز المساعدة والدعم</span>
                    <i class="fa-solid fa-chevron-left item-arrow"></i>
                </a>
                <a href="#" class="settings-item">
                    <div class="item-icon"><i class="fa-solid fa-circle-info"></i></div>
                    <span class="item-text">الشروط والأحكام</span>
                    <i class="fa-solid fa-chevron-left item-arrow"></i>
                </a>
            </div>

            <!-- زر تسجيل الخروج ينقلك لصفحة البداية index.html -->
            <button class="logout-btn" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
            </button>

        </main>

        <!-- شريط التنقل السفلي الفعال -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-link">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="orders.html" class="nav-link">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>طلباتي</span>
            </a>
            <a href="checkout.html" class="nav-link cart-nav-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <div class="cart-badge">2</div>
                <span>السلة</span>
            </a>
            <a href="profile.html" class="nav-link active">
                <i class="fa-solid fa-user"></i>
                <span>حسابي</span>
            </a>
        </nav>

    </div>

    <script>
        function logout() {
            if(confirm("هل أنت متأكد من تسجيل الخروج من تطبيق واجيك؟")) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
