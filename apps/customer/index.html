<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Speed Go - طلباتك أوامر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #F25C05; 
            --primary-glow: rgba(242, 92, 5, 0.8); 
            --dark-bg: #070709; 
            --text-light: #FFFFFF; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--dark-bg); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; color: var(--text-light); 
        }

        .app-container { 
            width: 100%; max-width: 420px; height: 100vh; position: relative; 
            display: flex; flex-direction: column; overflow: hidden; 
            background: radial-gradient(circle at center, #1c0b02 0%, var(--dark-bg) 75%); 
        }
        
        #splash-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; transition: opacity 0.8s ease; 
        }
        
        /* حلقة التوهج النيوني الخلفية */
        .logo-glow-ring { 
            position: absolute; width: 300px; height: 300px; border-radius: 50%; 
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%); 
            animation: pulseRing 2s ease-in-out infinite; z-index: 1; 
        }

        @keyframes pulseRing { 
            0%, 100% { transform: scale(0.85); opacity: 0.5; filter: blur(15px); } 
            50% { transform: scale(1.2); opacity: 0.9; filter: blur(25px); } 
        }

        /* 🌟 الواجهة الأولى: الشعار يرتج ويبرز */
        .splash-logo { 
            width: 240px; position: relative; z-index: 2; 
            animation: popAndVibrate 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                       engineVibration 0.3s ease-in-out 1.8s infinite; 
            filter: drop-shadow(0 0 25px var(--primary-glow)); 
        }

        @keyframes popAndVibrate { 
            0% { transform: scale(0.4) rotate(-5deg); opacity: 0; } 
            60% { transform: scale(1.12) rotate(2deg); opacity: 1; } 
            80% { transform: scale(0.95) rotate(-1deg); } 
            100% { transform: scale(1) rotate(0deg); opacity: 1; } 
        }

        @keyframes engineVibration {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-1.5px, 1.5px) rotate(-0.5deg); }
            40% { transform: translate(1.5px, -1.5px) rotate(0.5deg); }
            60% { transform: translate(-1px, -0.5px) rotate(-0.3deg); }
            80% { transform: translate(1px, 1px) rotate(0.3deg); }
        }

        .slogan-card { 
            position: relative; z-index: 2; margin-top: 35px; 
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px); 
            border: 1px solid rgba(242, 92, 5, 0.5); padding: 10px 28px; 
            border-radius: 35px; opacity: 0; 
            box-shadow: 0 0 25px rgba(242, 92, 5, 0.3);
            animation: fadeInSlogan 1.2s ease 1s forwards; 
        }

        .slogan-text { 
            color: #FF9E59; font-weight: 900; font-size: 19px; 
            text-shadow: 0 0 12px rgba(242, 92, 5, 0.8); 
            letter-spacing: 1px;
        }

        @keyframes fadeInSlogan { 
            to { opacity: 1; transform: translateY(-5px); } 
        }

        /* =========================================
           الواجهة الثانية: شاشة البدء (بدون ارتجاج، الشعار ثابت وكبير)
           ========================================= */
        #auth-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; 
            padding: 50px 25px; z-index: 50; opacity: 0; visibility: hidden; 
            transition: opacity 0.8s ease; 
        }

        .auth-logo-section { display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        
        /* 🌟 الواجهة الثانية: الشعار ثابت تماماً وأكبر حجماً ووضوحاً */
        .auth-logo { 
            width: 250px; 
            filter: drop-shadow(0 0 25px var(--primary-glow)); 
            margin-bottom: 10px;
        }

        .auth-title { font-size: 30px; font-weight: 900; color: #FFFFFF; text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .auth-subtitle { color: var(--primary); font-size: 12px; font-weight: 800; letter-spacing: 3px; margin-bottom: 20px; }

        .auth-actions { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }

        /* 🌟 زر "ابدأ" السحري والإدماني */
        .btn-magical-start {
            width: 100%;
            background: linear-gradient(135deg, #FF7B35 0%, #F25C05 50%, #D44100 100%);
            color: white; border: none; padding: 18px; border-radius: 20px;
            font-size: 18px; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 30px rgba(242, 92, 5, 0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .btn-magical-start::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg); animation: magicalShimmer 3s linear infinite;
        }

        @keyframes magicalShimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .btn-magical-start:hover { transform: scale(1.03); box-shadow: 0 15px 35px rgba(242, 92, 5, 0.7); }
        .btn-magical-start:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(242, 92, 5, 0.4); }

        .welcome-hint {
            font-size: 13px; color: #8C8C9E; text-align: center; font-weight: 700;
        }

    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- الواجهة الأولى: شاشة البداية مع الارتجاج -->
        <div id="splash-screen">
            <div class="logo-glow-ring"></div>
            <img src="1000167488-removebg-preview.png" alt="Speed Go" class="splash-logo">
            <div class="slogan-card">
                <div class="slogan-text">طلباتك أوامر</div>
            </div>
        </div>

        <!-- الواجهة الثانية: شاشة البدء بالشعار الثابت والأكبر -->
        <div id="auth-screen">
            <div class="auth-logo-section">
                <img src="1000167488-removebg-preview.png" alt="Speed Go" class="auth-logo">
                <h1 class="auth-title">Speed Go</h1>
                <p class="auth-subtitle">FAST. SAFE. DELIVERED.</p>
                <div class="slogan-card" style="opacity: 1; animation: none; padding: 6px 20px; margin-top: 0;">
                    <div class="slogan-text" style="font-size: 15px;">طلباتك أوامر</div>
                </div>
            </div>

            <div class="auth-actions">
                <!-- زر ابدأ السحري الخرافي -->
                <button class="btn-magical-start" onclick="window.location.href='home.html'">
                    ابدأ الآن <i class="fa-solid fa-bolt" style="font-size: 16px; color: #FFE359;"></i>
                </button>
                <p class="welcome-hint">انطلق لتكتشف أسرع تجربة توصيل في مدينتك ⚡</p>
            </div>
        </div>

    </div>

    <script>
        // الانتقال التلقائي بعد 4.8 ثانية (تقليل 25% من 6.4)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const auth = document.getElementById('auth-screen');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                auth.style.visibility = 'visible';
                auth.style.opacity = '1';
                
            }, 4800); 
        });
    </script>
</body>
</html>
