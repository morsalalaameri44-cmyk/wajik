<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - Speed Go</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-glow: rgba(242, 92, 5, 0.4);
            --bg-dark: #0F172A;
            --white: #FFFFFF;
            --text-gray: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        /* خلفية واجهة تسجيل الدخول (الأصلية) */
        body {
            background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1080&q=80');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: relative;
            overflow: hidden; /* يمنع التمرير حتى يتجاوز المستخدم الشاشة الافتتاحية */
        }

        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
            z-index: 1;
        }

        /* =========================================
           1. شاشة البداية (Splash Screen) بخلفية سوداء متدرجة ناعمة
           ========================================= */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* خلفية سوداء متدرجة ناعمة بدون طبقات مقسمة */
            background: linear-gradient(135deg, #050505 0%, #151515 50%, #000000 100%);
            background-size: 200% 200%;
            animation: smoothDarkWave 10s ease infinite;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        @keyframes smoothDarkWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* كلاس الاختفاء الذي سيتم إضافته عند الضغط على الزر */
        .hide-splash {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo-container {
            position: relative;
            width: 240px;
            background: transparent;
            /* حركة دخول سلسة يعقبها طفو */
            animation: speedEntry 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                       floatAnim 2.5s ease-in-out 0.8s infinite;
        }

        /* توهج دائري ناعم خلف الصورة يمنع ظهور الحواف المربعة */
        .splash-logo-container::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 210px; height: 210px;
            background: radial-gradient(circle, rgba(242, 92, 5, 0.35) 0%, rgba(242, 92, 5, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: pulseGlow 2.5s ease-in-out 0.8s infinite;
        }

        .splash-logo-container img {
            width: 100%; height: auto; object-fit: contain; display: block;
        }

        .splash-slogan {
            margin-top: 15px;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #F25C05 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(242, 92, 5, 0.3));
            opacity: 0;
            animation: revealSlogan 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 1s; 
        }

        /* زر "ابدأ الآن" الجديد بمكانه المعدل */
        .btn-start-now {
            margin-top: 90px; /* تمت إزاحته للأسفل بشكل مناسب */
            padding: 16px 45px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #FF6B35 0%, #F25C05 100%);
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(242, 92, 5, 0.4);
            opacity: 0;
            transform: translateY(20px);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 3;
            animation: revealSlogan 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards, pulseBtn 2s infinite ease-in-out;
            animation-delay: 1.5s, 2.3s; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-start-now:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(242, 92, 5, 0.6);
        }

        .btn-start-now:active {
            transform: scale(0.95);
        }

        /* حركات CSS */
        @keyframes speedEntry {
            0% { transform: scale(0) translateY(50px); opacity: 0; }
            60% { transform: scale(1.1) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes floatAnim {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        }

        @keyframes revealSlogan {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(242, 92, 5, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(242, 92, 5, 0); }
            100% { box-shadow: 0 0 0 0 rgba(242, 92, 5, 0); }
        }

        /* =========================================
           2. واجهة تسجيل الدخول (المرحلة الثانية)
           ========================================= */
        .auth-container {
            width: 100%; max-width: 400px; padding: 35px 30px; position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); text-align: center;
            margin: 20px;
            opacity: 0;
            transform: translateY(30px);
        }

        /* الكلاس الذي يفعل حركة دخول واجهة تسجيل الدخول */
        .show-auth {
            animation: fadeInInterface 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInInterface {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            position: relative;
            width: 155px; height: auto; margin: 0 auto 15px auto;
            background: transparent; display: flex; justify-content: center; align-items: center;
        }

        /* توهج دائري ناعم خلف شعار الدخول */
        .logo-box::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(242, 92, 5, 0.25) 0%, rgba(242, 92, 5, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            transition: all 0.3s ease;
        }
        
        .logo-box:hover::before {
            background: radial-gradient(circle, rgba(242, 92, 5, 0.4) 0%, rgba(242, 92, 5, 0) 70%);
            transform: translate(-50%, -50%) scale(1.2);
        }

        .logo-box img {
            width: 100%; height: auto; object-fit: contain; display: block;
        }

        .auth-container h1 { font-size: 28px; font-weight: 900; color: var(--white); margin-bottom: 5px; letter-spacing: 0.5px; }
        .auth-container p { font-size: 15px; color: var(--text-gray); margin-bottom: 30px; font-weight: 500; }

        .tabs { display: flex; background: rgba(0,0,0,0.3); border-radius: 16px; margin-bottom: 25px; padding: 6px; }
        .tab {
            flex: 1; padding: 12px; border-radius: 12px; color: var(--text-gray);
            font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.3s ease;
        }
        .tab.active { background: var(--white); color: var(--bg-dark); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--text-gray); font-size: 16px; transition: 0.3s; }
        .auth-input {
            width: 100%; padding: 18px 45px 18px 16px; border-radius: 16px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            color: white; font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .auth-input::placeholder { color: var(--text-gray); }
        .auth-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 4px rgba(242,92,5,0.15); }
        .auth-input:focus + i { color: var(--primary); }

        .btn-primary {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, #FF6B35 0%, #F25C05 100%);
            color: white; font-size: 17px; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 25px var(--primary-glow); margin-top: 10px; transition: all 0.2s ease;
        }
        .btn-primary:active { transform: scale(0.96); box-shadow: 0 5px 15px var(--primary-glow); }

        .divider {
            display: flex; align-items: center; margin: 25px 0; color: var(--text-gray); font-size: 13px; font-weight: 700;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); margin: 0 15px; }

        .btn-guest {
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03); color: white; font-size: 15px; font-weight: 800;
            cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .btn-guest:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
        .btn-guest:active { transform: scale(0.96); }

        #errorMessage { color: #EF4444; font-size: 13px; font-weight: 700; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- شاشة البداية الخرافية -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo-container">
                <img src="1000167488-removebg-preview.png" alt="Speed Go Logo">
            </div>
            <div class="splash-slogan">معنا طلبك أسرع</div>
            
            <!-- زر الانتقال -->
            <button class="btn-start-now" onclick="startApp()">
                ابدأ الآن <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- واجهة تسجيل الدخول الرسمية (بخلفية الطعام الأصلية) -->
    <div class="auth-container" id="authContainer">
        <div class="logo-box">
            <img src="1000167488-removebg-preview.png" alt="Speed Go Logo">
        </div>
        
        <h1>Speed Go</h1>
        <p>معنا طلبك أسرع</p>

        <div class="tabs">
            <div class="tab active" id="tabLogin" onclick="switchMode('login')">تسجيل الدخول</div>
            <div class="tab" id="tabSignup" onclick="switchMode('signup')">حساب جديد</div>
        </div>

        <div id="authForm">
            <div class="input-group" id="nameGroup" style="display: none;">
                <input type="text" id="nameInput" class="auth-input" placeholder="اسمك الكريم">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-group">
                <input type="email" id="emailInput" class="auth-input" placeholder="البريد الإلكتروني">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" class="auth-input" placeholder="كلمة المرور">
                <i class="fa-solid fa-lock"></i>
            </div>

            <p id="errorMessage"></p>

            <button class="btn-primary" id="actionBtn" onclick="handleAuth()">دخول</button>
        </div>

        <div class="divider">أو</div>

        <!-- زر الدخول كزائر -->
        <a href="home.html" class="btn-guest">
            تصفح التطبيق كزائر <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // دالة يتم استدعاؤها عند الضغط على زر "ابدأ الآن"
        function startApp() {
            const splash = document.getElementById('splash-screen');
            const authContainer = document.getElementById('authContainer');
            
            // 1. إضافة كلاس التلاشي لشاشة البداية
            splash.classList.add('hide-splash');
            
            // 2. الانتظار حتى تنتهي حركة التلاشي (600 جزء من الثانية)
            setTimeout(() => {
                splash.style.display = 'none'; // إزالتها من الشاشة نهائياً
                document.body.style.overflow = 'auto'; // السماح بالتمرير
                
                // 3. إظهار واجهة تسجيل الدخول بحركة انسيابية
                authContainer.classList.add('show-auth');
            }, 600);
        }

        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'sb_publishable_Gsn2xn5DjAJehY0SGFubzw_KxV-hG-4'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('errorMessage').style.display = 'none';
            
            if (mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'none';
                document.getElementById('actionBtn').innerText = 'دخول';
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'block';
                document.getElementById('actionBtn').innerText = 'إنشاء حساب';
            }
        }

        async function handleAuth() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            const errorMsg = document.getElementById('errorMessage');
            const btn = document.getElementById('actionBtn');

            if (!email || !password || (currentMode === 'signup' && !name)) {
                errorMsg.innerText = "يرجى تعبئة جميع الحقول.";
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة...';
            errorMsg.style.display = 'none';

            try {
                if (currentMode === 'signup') {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: { data: { full_name: name } }
                    });
                    if (error) throw error;
                    window.location.href = 'home.html';
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    if (error) throw error;
                    window.location.href = 'home.html';
                }
            } catch (err) {
                errorMsg.innerText = "حدث خطأ: تأكد من صحة البيانات.";
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = currentMode === 'login' ? 'دخول' : 'إنشاء حساب';
            }
        }

        // التحقق مما إذا كان المستخدم مسجلاً بالفعل لتوجيهه مباشرة
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        };
    </script>
</body>
</html>
