<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طلباتي - Speed Go</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #F25C05;
            --primary-glow: rgba(242, 92, 5, 0.2);
            --bg-body: #F4F6F9;
            --white: #FFFFFF;
            --text-dark: #121212;
            --text-gray: #7A8089;
            --card-shadow: 0 12px 35px rgba(0, 0, 0, 0.04);
            --border-light: #F0F2F5;
            --nav-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            --danger: #EF4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; max-height: 900px;
            background-color: var(--bg-body); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* الهيدر */
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 20px; display: flex; align-items: center; justify-content: center;
            position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border-light);
        }
        .header h2 { font-size: 18px; font-weight: 900; color: var(--text-dark); }

        /* التبويبات */
        .tabs-container {
            display: flex; background: var(--white); padding: 10px 20px 0 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .tab-btn {
            flex: 1; text-align: center; padding: 15px 10px; font-size: 15px;
            font-weight: 800; color: var(--text-gray); cursor: pointer;
            border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* المحتوى */
        .orders-content { flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.9); height: 0; margin: 0; padding: 0; } }

        /* شريط أدوات السجل (أيقونة الحذف) */
        .history-toolbar {
            display: flex; justify-content: flex-end; margin-bottom: 15px; display: none;
        }
        .history-toolbar.visible { display: flex; animation: fadeIn 0.4s ease; }
        .delete-history-btn {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none;
            padding: 8px 15px; border-radius: 12px; font-size: 13px; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .delete-history-btn:active { transform: scale(0.95); background: var(--danger); color: white; }

        /* بطاقة الطلب */
        .order-card {
            background: var(--white); border-radius: 20px; padding: 20px;
            box-shadow: var(--card-shadow); margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.8); transition: 0.4s ease;
        }
        .order-card.removing { animation: fadeOut 0.4s forwards; }
        
        .order-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px dashed #E5E7EB; margin-bottom: 15px;
        }
        .order-id { font-size: 14px; font-weight: 900; color: var(--text-dark); }
        .order-date { font-size: 12px; font-weight: 500; color: var(--text-gray); }

        .order-details { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .store-info { display: flex; align-items: center; gap: 12px; }
        .store-icon {
            width: 45px; height: 45px; background: #F8FAFC; border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; color: var(--primary); border: 1px solid var(--border-light);
        }
        .store-name { font-size: 15px; font-weight: 900; color: var(--text-dark); margin-bottom: 4px; }
        .items-count { font-size: 12px; color: var(--text-gray); font-weight: 700; }
        .order-price { font-size: 16px; font-weight: 900; color: var(--primary); }

        /* شريط التتبع (Timeline) */
        .status-timeline {
            display: flex; justify-content: space-between; position: relative;
            margin-bottom: 15px; padding: 0 10px;
        }
        .status-timeline::before {
            content: ''; position: absolute; top: 12px; left: 20px; right: 20px;
            height: 3px; background: #E5E7EB; z-index: 1; border-radius: 2px;
        }
        .status-timeline::after {
            content: ''; position: absolute; top: 12px; right: 20px;
            height: 3px; background: var(--primary); z-index: 2; border-radius: 2px;
            width: var(--progress, 0%); transition: 1s ease;
        }
        
        .status-dot {
            width: 26px; height: 26px; background: #E5E7EB; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            z-index: 3; position: relative; font-size: 11px; color: white;
            transition: 0.5s ease; border: 3px solid var(--white);
        }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        .status-text {
            text-align: center; font-size: 11px; font-weight: 800; color: var(--text-gray);
            margin-top: 8px; width: 60px;
        }
        .status-text.active { color: var(--primary); }
        .status-step { display: flex; flex-direction: column; align-items: center; }

        /* أزرار الإجراءات */
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn {
            flex: 1; padding: 12px; border-radius: 14px; font-size: 13px; font-weight: 800;
            border: none; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none;
        }
        .btn-track { background: rgba(242, 92, 5, 0.1); color: var(--primary); }
        .btn-track:active { background: rgba(242, 92, 5, 0.2); transform: scale(0.96); }
        .btn-reorder { background: #F8FAFC; color: var(--text-dark); border: 1px solid var(--border-light); }
        .btn-reorder:active { background: #E2E8F0; transform: scale(0.96); }

        /* حالة الفراغ */
        .empty-state {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 60vh; text-align: center; padding: 20px;
        }
        .empty-icon {
            width: 100px; height: 100px; background: var(--white); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 40px;
            color: #CBD5E1; margin-bottom: 20px; box-shadow: var(--card-shadow);
        }
        .empty-state h3 { font-size: 18px; font-weight: 900; color: var(--text-dark); margin-bottom: 10px; }
        .empty-state p { font-size: 14px; color: var(--text-gray); margin-bottom: 25px; line-height: 1.5; }
        .btn-shop {
            background: linear-gradient(135deg, #FF6B35 0%, #F25C05 100%);
            color: white; padding: 14px 30px; border-radius: 16px; text-decoration: none;
            font-size: 15px; font-weight: 900; box-shadow: 0 8px 20px var(--primary-glow); border: none; cursor: pointer;
        }

        /* نافذة التأكيد (Modal) للحذف */
        .confirm-modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            z-index: 200; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .confirm-modal-overlay.active { opacity: 1; visibility: visible; }
        .confirm-modal {
            background: white; width: 85%; border-radius: 24px; padding: 25px;
            text-align: center; transform: translateY(20px) scale(0.95); transition: 0.3s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .confirm-modal-overlay.active .confirm-modal { transform: translateY(0) scale(1); }
        .modal-icon {
            width: 60px; height: 60px; background: rgba(239, 68, 68, 0.1); color: var(--danger);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; margin: 0 auto 15px auto;
        }
        .confirm-modal h3 { font-size: 18px; font-weight: 900; color: var(--text-dark); margin-bottom: 10px; }
        .confirm-modal p { font-size: 13px; color: var(--text-gray); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 900;
            border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-cancel { background: #F3F4F6; color: var(--text-dark); }
        .btn-cancel:active { background: #E5E7EB; }
        .btn-confirm-delete { background: var(--danger); color: white; box-shadow: 0 5px 15px var(--danger-glow); }
        .btn-confirm-delete:active { transform: scale(0.95); }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75px; background-color: #FFFFFF;
            border-top: 1px solid var(--border-light); box-shadow: var(--nav-shadow); display: flex;
            justify-content: space-around; align-items: center; z-index: 100; padding: 0 10px;
        }
        .nav-link {
            display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray);
            text-decoration: none; font-size: 11px; font-weight: 800; transition: 0.2s; width: 60px;
        }
        .nav-link i { font-size: 20px; }
        .nav-link.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <h2>طلباتي</h2>
        </header>

        <div class="tabs-container">
            <div class="tab-btn active" onclick="switchTab('active')">الطلبات الحالية</div>
            <div class="tab-btn" onclick="switchTab('past')">الطلبات السابقة</div>
        </div>

        <main class="orders-content no-scrollbar">
            
            <!-- تبويب الطلبات الحالية -->
            <div id="active-orders" class="tab-content active">
                <div id="activeOrdersList">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size:30px; color:var(--primary);"></i>
                        <p style="margin-top:15px; font-weight:700;">جاري جلب طلباتك...</p>
                    </div>
                </div>
            </div>

            <!-- تبويب الطلبات السابقة -->
            <div id="past-orders" class="tab-content">
                <!-- شريط أدوات الحذف -->
                <div class="history-toolbar" id="historyToolbar">
                    <button class="delete-history-btn" onclick="openDeleteModal()">
                        <i class="fa-regular fa-trash-can"></i> مسح السجل
                    </button>
                </div>
                
                <div id="pastOrdersList">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size:30px; color:var(--primary);"></i>
                        <p style="margin-top:15px; font-weight:700;">جاري جلب السجل...</p>
                    </div>
                </div>
            </div>

        </main>

        <!-- نافذة تأكيد الحذف -->
        <div class="confirm-modal-overlay" id="deleteModal">
            <div class="confirm-modal">
                <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3>مسح السجل بالكامل؟</h3>
                <p>سيتم حذف جميع طلباتك السابقة والمكتملة بشكل نهائي. لا يمكن التراجع عن هذا الإجراء.</p>
                <div class="modal-actions">
                    <button class="modal-btn btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
                    <button class="modal-btn btn-confirm-delete" id="confirmDeleteBtn" onclick="deleteAllPastOrders()">نعم، امسح السجل</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-link">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="orders.html" class="nav-link active">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>طلباتي</span>
            </a>
            <a href="checkout.html" class="nav-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>السلة</span>
            </a>
            <a href="profile.html" class="nav-link">
                <i class="fa-solid fa-user"></i>
                <span>حسابي</span>
            </a>
        </nav>

    </div>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // إعداد الاتصال بقاعدة البيانات
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'sb_publishable_Gsn2xn5DjAJehY0SGFubzw_KxV-hG-4'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUserId = null;

        // التبديل بين التبويبات
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(`${tabId}-orders`).classList.add('active');
        }

        // إغلاق وفتح نافذة الحذف
        function openDeleteModal() { document.getElementById('deleteModal').classList.add('active'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }

        const statusConfig = {
            'new': { text: 'بانتظار التأكيد', progress: '0%', step: 1 },
            'processing': { text: 'جاري التجهيز', progress: '50%', step: 2 },
            'delivering': { text: 'في الطريق', progress: '100%', step: 3 },
            'completed': { text: 'مكتمل', color: '#10B981', icon: 'fa-check-double' },
            'cancelled': { text: 'ملغي', color: '#EF4444', icon: 'fa-xmark' }
        };

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
            return new Date(dateString).toLocaleDateString('ar-SA', options);
        }

        function buildActiveOrderCard(order) {
            const config = statusConfig[order.status] || statusConfig['new'];
            const itemsCount = (order.order_items && Array.isArray(order.order_items)) ? order.order_items.length : 0;
            const orderId = order.id ? order.id.toString().substring(0,6).toUpperCase() : '----';
            const total = order.total_amount || 0;
            
            return `
            <div class="order-card">
                <div class="order-header">
                    <span class="order-id">طلب #${orderId}</span>
                    <span class="order-date">${formatDate(order.created_at)}</span>
                </div>
                
                <div class="order-details">
                    <div class="store-info">
                        <div class="store-icon"><i class="fa-solid fa-store"></i></div>
                        <div>
                            <h4 class="store-name">${order.store_name || 'طلب من Speed Go'}</h4>
                            <span class="items-count">${itemsCount} عناصر</span>
                        </div>
                    </div>
                    <div class="order-price">${total.toLocaleString()} ر.ي</div>
                </div>

                <div class="status-timeline" style="--progress: ${config.progress};">
                    <div class="status-step">
                        <div class="status-dot ${config.step >= 1 ? 'active' : ''}"><i class="fa-solid fa-check"></i></div>
                        <div class="status-text ${config.step >= 1 ? 'active' : ''}">تم الاستلام</div>
                    </div>
                    <div class="status-step">
                        <div class="status-dot ${config.step >= 2 ? 'active' : ''}"><i class="fa-solid fa-fire-burner"></i></div>
                        <div class="status-text ${config.step >= 2 ? 'active' : ''}">قيد التجهيز</div>
                    </div>
                    <div class="status-step">
                        <div class="status-dot ${config.step >= 3 ? 'active' : ''}"><i class="fa-solid fa-motorcycle"></i></div>
                        <div class="status-text ${config.step >= 3 ? 'active' : ''}">في الطريق</div>
                    </div>
                </div>

                <div class="card-actions">
                    <a href="tracking.html?id=${order.id}" class="action-btn btn-track">تتبع الطلب مباشرة</a>
                </div>
            </div>`;
        }

        function buildPastOrderCard(order) {
            const config = statusConfig[order.status] || statusConfig['completed'];
            const itemsCount = (order.order_items && Array.isArray(order.order_items)) ? order.order_items.length : 0;
            const orderId = order.id ? order.id.toString().substring(0,6).toUpperCase() : '----';
            const total = order.total_amount || 0;

            return `
            <div class="order-card past-card">
                <div class="order-header">
                    <span class="order-id">طلب #${orderId}</span>
                    <span class="order-date" style="color: ${config.color}; font-weight:800;">
                        <i class="fa-solid ${config.icon}"></i> ${config.text}
                    </span>
                </div>
                
                <div class="order-details">
                    <div class="store-info">
                        <div class="store-icon"><i class="fa-solid fa-store"></i></div>
                        <div>
                            <h4 class="store-name">${order.store_name || 'طلب من Speed Go'}</h4>
                            <span class="items-count">${formatDate(order.created_at)} • ${itemsCount} عناصر</span>
                        </div>
                    </div>
                    <div class="order-price">${total.toLocaleString()} ر.ي</div>
                </div>

                <div class="card-actions">
                    <button class="action-btn btn-reorder" onclick="reorder('${order.id}')">إعادة الطلب</button>
                </div>
            </div>`;
        }

        async function fetchUserOrders() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    document.getElementById('activeOrdersList').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fa-solid fa-user-lock"></i></div>
                            <h3>يرجى تسجيل الدخول</h3>
                            <p>عليك تسجيل الدخول لمتابعة طلباتك الحالية والسابقة.</p>
                            <a href="index.html" class="btn-shop">تسجيل الدخول</a>
                        </div>`;
                    document.getElementById('pastOrdersList').innerHTML = document.getElementById('activeOrdersList').innerHTML;
                    return;
                }
                currentUserId = user.id;

                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('customer_id', currentUserId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const activeContainer = document.getElementById('activeOrdersList');
                const pastContainer = document.getElementById('pastOrdersList');
                const historyToolbar = document.getElementById('historyToolbar');

                activeContainer.innerHTML = '';
                pastContainer.innerHTML = '';

                if (!orders || orders.length === 0) {
                    activeContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                            <h3>لا توجد طلبات حالية</h3>
                            <p>يبدو أنك لم تقم بأي طلبات بعد. اختر متجرك المفضّل وابدأ الآن!</p>
                            <a href="home.html" class="btn-shop">تصفح المتاجر</a>
                        </div>`;
                    pastContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fa-solid fa-receipt"></i></div>
                            <h3>سجل الطلبات فارغ</h3>
                            <p>ليس لديك أي طلبات سابقة في سجلك.</p>
                        </div>`;
                    historyToolbar.classList.remove('visible');
                    return;
                }

                let activeCount = 0;
                let pastCount = 0;

                orders.forEach(order => {
                    if (['new', 'processing', 'delivering'].includes(order.status)) {
                        activeContainer.innerHTML += buildActiveOrderCard(order);
                        activeCount++;
                    } else {
                        pastContainer.innerHTML += buildPastOrderCard(order);
                        pastCount++;
                    }
                });

                if (activeCount === 0) {
                    activeContainer.innerHTML = `
                        <div class="empty-state" style="height: 40vh;">
                            <h3>لا توجد طلبات نشطة حالياً</h3>
                            <p>جميع طلباتك تم إنجازها.</p>
                            <a href="home.html" class="btn-shop" style="padding: 10px 20px; font-size:13px;">اطلب الآن</a>
                        </div>`;
                }

                if (pastCount === 0) {
                    pastContainer.innerHTML = `
                        <div class="empty-state" style="height: 40vh;">
                            <h3>سجل الطلبات فارغ</h3>
                            <p>ليس لديك طلبات سابقة.</p>
                        </div>`;
                    historyToolbar.classList.remove('visible');
                } else {
                    historyToolbar.classList.add('visible');
                }

            } catch (err) {
                console.error("Error fetching orders:", err);
            }
        }

        async function deleteAllPastOrders() {
            if (!currentUserId) return;
            const btn = document.getElementById('confirmDeleteBtn');
            btn.innerText = "جاري الحذف...";
            btn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('orders')
                    .delete()
                    .eq('customer_id', currentUserId)
                    .in('status', ['completed', 'cancelled']);

                if (error) throw error;

                closeDeleteModal();
                fetchUserOrders();
            } catch (err) {
                console.error("Error deleting history:", err);
                alert("حدث خطأ أثناء مسح السجل.");
            } finally {
                btn.innerText = "نعم، امسح السجل";
                btn.disabled = false;
            }
        }

        function reorder(orderId) {
            alert("تم نسخ المنتجات إلى السلة بنجاح!");
            window.location.href = 'checkout.html';
        }

        window.onload = fetchUserOrders;
    </script>
</body>
</html>
