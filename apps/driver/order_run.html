<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تنفيذ الطلب - Speed Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #F25C05; --bg-dark: #121212; --surface: #1E1E1E; --text-light: #FFFFFF; --success: #05CD99; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; display: flex; justify-content: center; min-height: 100vh; color: var(--text-light); }
        .app-container { width: 100%; max-width: 420px; background-color: var(--bg-dark); display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .header { padding: 20px; background: var(--surface); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .header h2 { font-size: 18px; font-weight: 900; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .customer-card { background: rgba(242, 92, 5, 0.1); border: 1px solid rgba(242, 92, 5, 0.2); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .cust-name { font-size: 18px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .cust-phone { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .call-btn { background: var(--primary); color: white; padding: 8px 15px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .order-details { background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 14px; }
        .detail-row:last-child { border: none; margin: 0; padding: 0; }
        .total-price { font-size: 20px; font-weight: 900; color: var(--success); }
        .action-btn { width: 100%; background: var(--success); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2 id="orderTitle">جاري تحميل بيانات الطلب...</h2>
        </div>
        <div class="content" id="orderContent">
            <div style="text-align:center; margin-top:50px;"><i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--primary);"></i></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient('https://ldefaxirgruqulxhkaqh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWZheGlyZ3J1cXVseGhrYXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjI1MjEsImV4cCI6MjA5OTAzODUyMX0.WyCwILEemzN0z5UOTd4aVC6YCxmXHTyAKcai00CJtvw');
        const session = JSON.parse(localStorage.getItem('user_session'));
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        let orderData = null;

        if (!session || !orderId) { window.location.href = 'index.html'; }

        async function loadOrderData() {
            try {
                const { data, error } = await supabaseClient.from('orders').select('*').eq('id', orderId).single();
                if (error) throw error;
                orderData = data;
                
                const shortId = orderData.id.toString().substring(0, 6).toUpperCase();
                document.getElementById('orderTitle').innerText = `طلب #${shortId}`;
                
                const custName = orderData.customer_name || orderData.name || 'عميل غير مسجل';
                const custPhone = orderData.customer_phone || orderData.phone || '';
                const total = orderData.total_amount || orderData.total_price || orderData.price || orderData.total || 0;
                const address = orderData.address || orderData.location || 'غير محدد';

                document.getElementById('orderContent').innerHTML = `
                    <div class="customer-card">
                        <div class="cust-name"><i class="fa-solid fa-user-circle"></i> ${custName}</div>
                        <div class="cust-phone"><i class="fa-solid fa-phone"></i> <span dir="ltr">${custPhone}</span> 
                            ${custPhone ? `<a href="tel:${custPhone}" class="call-btn"><i class="fa-solid fa-phone-volume"></i> اتصال</a>` : ''}
                        </div>
                        <div style="font-size:13px; color:#ddd;"><i class="fa-solid fa-location-dot"></i> <strong>الموقع:</strong> ${address}</div>
                    </div>
                    
                    <div class="order-details">
                        <div class="detail-row"><span>المطلوب تحصيله من العميل:</span> <span class="total-price">${total} ر.ي</span></div>
                        <div class="detail-row"><span>ملاحظات:</span> <span>${orderData.notes || 'لا يوجد'}</span></div>
                    </div>

                    <button class="action-btn" onclick="completeDelivery()" id="completeBtn">
                        <i class="fa-solid fa-check-double"></i> تم التسليم بنجاح
                    </button>
                `;
            } catch (err) {
                alert("خطأ في جلب بيانات الطلب!");
                window.location.href = 'index.html';
            }
        }

        async function completeDelivery() {
            const btn = document.getElementById('completeBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإقفال...';
            btn.disabled = true;

            try {
                // 1. تحديث حالة الطلب إلى مكتمل
                await supabaseClient.from('orders').update({ status: 'completed' }).eq('id', orderId);
                
                // 2. تحديث عهدة المندوب وإعادته لحالة "نشط"
                if(session.reference_id) {
                    const { data: driverInfo } = await supabaseClient.from('drivers').select('wallet_balance').eq('id', session.reference_id).single();
                    
                    let orderRawValue = orderData.total_amount || orderData.total_price || orderData.price || orderData.total || "0";
                    let orderValue = parseFloat(orderRawValue.toString().replace(/[^\d.-]/g, '')) || 0;
                    const newBalance = (parseFloat(driverInfo.wallet_balance) || 0) + orderValue;

                    await supabaseClient.from('drivers').update({ status: 'نشط', wallet_balance: newBalance }).eq('id', session.reference_id);
                }

                alert('تم إغلاق الطلب وتوريد المبلغ לلعهدة بنجاح!');
                window.location.replace('index.html');
            } catch (err) {
                alert('فشل إنهاء الطلب!');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-double"></i> تم التسليم بنجاح';
            }
        }

        window.onload = loadOrderData;
    </script>
</body>
</html>
