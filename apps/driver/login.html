<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل دخول الكابتن - Speed Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #F25C05; --bg-dark: #121212; --surface: #1E1E1E; --text-light: #FFFFFF; --text-gray: #A0A0A0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-light); }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background-color: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        
        .logo-box { width: 80px; height: 80px; background: var(--primary); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 35px; color: white; margin: 0 auto 20px auto; transform: rotate(-5deg); box-shadow: 0 10px 25px rgba(242, 92, 5, 0.3); }
        h1 { text-align: center; font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        p { text-align: center; font-size: 14px; color: var(--text-gray); margin-bottom: 30px; }
        
        .input-group { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; display: flex; align-items: center; padding: 15px; margin-bottom: 15px; transition: 0.3s; }
        .input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(242, 92, 5, 0.2); }
        .input-group i { color: var(--text-gray); margin-left: 15px; font-size: 18px; }
        .input-group input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 15px; font-weight: 700; }
        .input-group input::placeholder { color: var(--text-gray); }
        
        .login-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 15px; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; transition: 0.2s; }
        .login-btn:active { transform: scale(0.98); }
        #errorMsg { color: #EE5D50; font-size: 13px; font-weight: 700; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo-box"><i class="fa-solid fa-motorcycle"></i></div>
        <h1>بوابة الكابتن</h1>
        <p>Speed Go - سجل دخولك لتبدأ ورديتك</p>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="البريد الإلكتروني للكابتن" dir="ltr" style="text-align: right;">
        </div>
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">تسجيل الدخول</button>
        <div id="errorMsg">البيانات غير صحيحة، يرجى المحاولة مجدداً.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = supabase.createClient('https://ldefaxirgruqulxhkaqh.supabase.co', 'sb_publishable_Gsn2xn5DjAJehY0SGFubzw_KxV-hG-4');
        
        // فحص ما إذا كان مسجلاً مسبقاً
        window.onload = async () => {
            const { data } = await supabase.auth.getSession();
            if (data.session) window.location.href = 'index.html';
        };

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if(!email || !password) return;

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.style.display = 'block';
                btn.innerHTML = 'تسجيل الدخول';
                btn.disabled = false;
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
