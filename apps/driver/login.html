<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - Speed Go كابتن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #F25C05; --bg-dark: #121212; --surface: #1E1E1E; --text-light: #FFFFFF; --text-gray: #A0A0A0; --danger: #EE5D50; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--text-light); }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background-color: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-shadow: 0 0 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .app-container::before { content: ''; position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(242, 92, 5, 0.2); filter: blur(50px); border-radius: 50%; z-index: 0; }
        .app-container::after { content: ''; position: absolute; bottom: -50px; left: -50px; width: 200px; height: 200px; background: rgba(242, 92, 5, 0.1); filter: blur(50px); border-radius: 50%; z-index: 0; }
        
        .login-box { width: 100%; background: var(--surface); padding: 30px 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.3); z-index: 1; }
        
        .logo-container {
            width: 170px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            animation: floatAnim 3s ease-in-out infinite;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes floatAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 10px rgba(242, 92, 5, 0.5)); }
            50% { filter: drop-shadow(0 0 22px rgba(242, 92, 5, 0.9)) drop-shadow(0 0 5px rgba(255, 255, 255, 0.4)); }
            100% { filter: drop-shadow(0 0 10px rgba(242, 92, 5, 0.5)); }
        }

        .title { text-align: center; font-size: 22px; font-weight: 900; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: var(--text-gray); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-gray); font-size: 18px; }
        .form-input { width: 100%; padding: 16px 45px 16px 15px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(242, 92, 5, 0.2); }
        .login-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(242, 92, 5, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .login-btn:active { transform: scale(0.96); box-shadow: 0 5px 10px rgba(242, 92, 5, 0.3); }
        .error-msg { background: rgba(238, 93, 80, 0.1); color: var(--danger); padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 20px; display: none; border: 1px solid rgba(238, 93, 80, 0.2); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="login-box">
            
            <div class="logo-container">
                <img src="1000167488-removebg-preview (1).png" alt="Speed Go Logo">
            </div>

            <h2 class="title">بوابة الكابتن</h2>
            <p class="subtitle">قم بتسجيل الدخول لبدء استلام الطلبات</p>
            
            <div class="error-msg" id="errorMsg">اسم المستخدم أو كلمة المرور غير صحيحة.</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" class="form-input" placeholder="اسم المستخدم أو رقم الهاتف" required dir="ltr" style="text-align: right;">
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="كلمة المرور" required dir="ltr" style="text-align: right;">
                </div>
                <button type="submit" class="login-btn" id="submitBtn">
                    تسجيل الدخول <i class="fa-solid fa-arrow-left-long"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWZheGlyZ3J1cXVseGhrYXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjI1MjEsImV4cCI6MjA5OTAzODUyMX0.WyCwILEemzN0z5UOTd4aVC6YCxmXHTyAKcai00CJtvw'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        window.onload = () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (session && session.role === 'driver') {
                window.location.href = 'index.html';
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const { data: accountData, error: accountError } = await supabaseClient
                    .from('system_accounts')
                    .select('*')
                    .eq('username', userVal)
                    .eq('password', passVal)
                    .eq('role', 'driver')
                    .single();

                if (accountError || !accountData) {
                    throw new Error('بيانات الدخول غير صحيحة، أو الحساب غير مصرح له ككابتن.');
                }

                let realDriverName = accountData.username; 
                if (accountData.reference_id) {
                    const { data: driverData, error: driverError } = await supabaseClient
                        .from('drivers')
                        .select('*')
                        .eq('id', accountData.reference_id)
                        .single();
                        
                    if (!driverError && driverData) {
                        realDriverName = driverData.driver_name || driverData.name || driverData.full_name || accountData.username;
                    }
                }

                const sessionData = {
                    ...accountData,
                    real_name: realDriverName 
                };

                localStorage.setItem('user_session', JSON.stringify(sessionData));
                window.location.href = 'index.html';

            } catch (err) {
                errorMsg.innerText = err.message || 'حدث خطأ في الاتصال، يرجى المحاولة لاحقاً.';
                errorMsg.style.display = 'block';
                btn.innerHTML = 'تسجيل الدخول <i class="fa-solid fa-arrow-left-long"></i>';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
