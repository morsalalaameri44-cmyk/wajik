<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الكابتن - Speed Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #F25C05; --bg-dark: #121212; --surface: #1E1E1E; --text-light: #FFFFFF; --text-gray: #A0A0A0; --success: #05CD99; --danger: #EE5D50; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-light); }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background-color: var(--bg-dark); position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .driver-header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: linear-gradient(to bottom, rgba(18,18,18,0.9) 0%, rgba(18,18,18,0) 100%); }
        .profile-btn { width: 40px; height: 40px; background-color: var(--surface); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: var(--text-light); border: 2px solid var(--primary); text-decoration: none; }
        .status-toggle { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .status-dot { width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); transition: 0.3s; }
        .map-area { flex: 1; background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80'); background-size: cover; background-position: center; position: relative; }
        .map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(18, 18, 18, 0.4); }
        .driver-marker { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background-color: rgba(242, 92, 5, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; animation: pulse 2s infinite; }
        .driver-marker i { color: var(--primary); font-size: 24px; background: white; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
        .order-sheet-container { position: absolute; bottom: 75px; left: 10px; right: 10px; z-index: 20; display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; overflow-x: hidden; -ms-overflow-style: none; scrollbar-width: none; }
        .order-sheet-container::-webkit-scrollbar { display: none; }
        .order-sheet { background-color: var(--surface); border-radius: 20px; padding: 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px; }
        .new-alert { color: var(--success); font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 5px;}
        .new-alert i { animation: ring 1s infinite; }
        .order-id { color: var(--text-gray); font-size: 13px; font-weight: 700; }
        @keyframes ring { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } 100% { transform: rotate(0); } }
        .route-info { margin-bottom: 20px; }
        .route-point { display: flex; gap: 15px; margin-bottom: 15px; position: relative; }
        .route-point:last-child { margin-bottom: 0; }
        .point-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; z-index: 2; }
        .pickup-icon { background-color: var(--primary); color: white; }
        .dropoff-icon { background-color: var(--success); color: white; }
        .route-point:first-child::after { content: ''; position: absolute; top: 30px; left: 14px; width: 2px; height: 25px; background-color: rgba(255,255,255,0.1); z-index: 1; }
        .point-details h4 { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
        .point-details p { font-size: 12px; color: var(--text-gray); }
        .accept-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .accept-btn:active { transform: scale(0.98); }
        .no-orders-msg { background-color: rgba(30, 30, 30, 0.8); backdrop-filter: blur(10px); border-radius: 20px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); color: var(--text-gray); font-weight: 700; font-size: 14px; display: none; }
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background-color: var(--surface); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 30; }
        .nav-link { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-gray); text-decoration: none; font-size: 11px; font-weight: 700; transition: 0.2s; }
        .nav-link i { font-size: 20px; }
        .nav-link.active { color: var(--primary); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="driver-header">
            <a href="profile.html" class="profile-btn"><i class="fa-solid fa-user"></i></a>
            <div class="status-toggle" id="statusToggle" onclick="toggleOnlineStatus()">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">متصل (متاح للطلبات)</span>
            </div>
        </div>

        <div class="map-area">
            <div class="map-overlay"></div>
            <div class="driver-marker">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
        </div>

        <div class="order-sheet-container" id="ordersContainer">
            <div class="no-orders-msg" id="noOrdersMsg">
                <i class="fa-solid fa-mug-hot" style="margin-bottom: 8px; font-size: 20px; display: block;"></i>
                لا توجد طلبات قريبة جاهزة للاستلام حالياً.
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-link active">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>الخريطة</span>
            </a>
            <a href="tasks.html" class="nav-link">
                <i class="fa-solid fa-clipboard-check"></i>
                <span>مهامي</span>
            </a>
            <a href="wallet.html" class="nav-link">
                <i class="fa-solid fa-wallet"></i>
                <span>محفظتي</span>
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://ldefaxirgruqulxhkaqh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWZheGlyZ3J1cXVseGhrYXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjI1MjEsImV4cCI6MjA5OTAzODUyMX0.WyCwILEemzN0z5UOTd4aVC6YCxmXHTyAKcai00CJtvw'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const ordersContainer = document.getElementById('ordersContainer');
        const noOrdersMsg = document.getElementById('noOrdersMsg');
        let isOnline = true;
        const notificationSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

        const driverSession = JSON.parse(localStorage.getItem('user_session'));

        function toggleOnlineStatus() {
            isOnline = !isOnline;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (isOnline) {
                dot.style.backgroundColor = 'var(--success)';
                dot.style.boxShadow = '0 0 10px var(--success)';
                text.innerText = 'متصل (متاح للطلبات)';
                fetchAvailableOrders();
            } else {
                dot.style.backgroundColor = 'var(--text-gray)';
                dot.style.boxShadow = 'none';
                text.innerText = 'غير متصل (استراحة)';
                Array.from(ordersContainer.children).forEach(child => {
                    if (child.id !== 'noOrdersMsg') {
                        ordersContainer.removeChild(child);
                    }
                });
                noOrdersMsg.innerHTML = `<i class="fa-solid fa-bed" style="margin-bottom: 8px; font-size: 20px; display: block;"></i> أنت الآن في وضع عدم الاتصال.`;
                noOrdersMsg.style.display = 'block';
            }
        }

        function buildOrderCard(order) {
            const customerName = order.customer_name || 'عميل Speed Go';
            const total = order.total_amount ? order.total_amount.toLocaleString() : '0';
            const orderIdShort = order.id.toString().substring(0, 6).toUpperCase();

            return `
            <div class="order-sheet" id="order-${order.id}">
                <div class="sheet-header">
                    <div class="new-alert"><i class="fa-solid fa-bell"></i> طلب جديد بانتظارك!</div>
                    <div class="order-id">#${orderIdShort}</div>
                </div>
                <div class="route-info">
                    <div class="route-point">
                        <div class="point-icon pickup-icon"><i class="fa-solid fa-store"></i></div>
                        <div class="point-details">
                            <h4>استلام: المطعم</h4>
                            <p>الطلب جاهز للاستلام الآن.</p>
                        </div>
                    </div>
                    <div class="route-point">
                        <div class="point-icon dropoff-icon"><i class="fa-solid fa-location-dot"></i></div>
                        <div class="point-details">
                            <h4>تسليم: ${customerName}</h4>
                            <p>الدفع عند الاستلام (${total} ر.ي)</p>
                        </div>
                    </div>
                </div>
                <button class="accept-btn" onclick="acceptOrder('${order.id}')" id="btn-${order.id}">
                    قبول الطلب والتوجه للمطعم <i class="fa-solid fa-arrow-left-long"></i>
                </button>
            </div>
            `;
        }

        async function fetchAvailableOrders() {
            if (!isOnline) return;
            try {
                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('status', 'processing')
                    .order('created_at', { ascending: true });

                if (error) throw error;

                Array.from(ordersContainer.children).forEach(child => {
                    if (child.id !== 'noOrdersMsg') {
                        ordersContainer.removeChild(child);
                    }
                });

                if (orders && orders.length > 0) {
                    noOrdersMsg.style.display = 'none';
                    notificationSound.play().catch(e => console.log("الصوت مقفل"));
                    orders.forEach(order => {
                        ordersContainer.insertAdjacentHTML('beforeend', buildOrderCard(order));
                    });
                } else {
                    noOrdersMsg.innerHTML = `<i class="fa-solid fa-mug-hot" style="margin-bottom: 8px; font-size: 20px; display: block;"></i> لا توجد طلبات قريبة جاهزة للاستلام حالياً.`;
                    noOrdersMsg.style.display = 'block';
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        window.acceptOrder = async function(orderId) {
            const btn = document.getElementById(`btn-${orderId}`);
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري تأكيد الاستلام...';
            btn.style.backgroundColor = 'var(--success)';
            btn.disabled = true;
            
            try {
                // استخدام الاسم الحقيقي للمندوب
                const driverName = driverSession ? (driverSession.real_name || driverSession.username) : 'مندوب';

                const { error: orderError } = await supabaseClient
                    .from('orders')
                    .update({ status: 'delivering', driver_name: driverName })
                    .eq('id', orderId);
                if (orderError) throw orderError;

                if (driverSession && driverSession.reference_id) {
                    await supabaseClient
                        .from('drivers')
                        .update({ status: 'مشغول' })
                        .eq('id', driverSession.reference_id);
                }

                window.location.href = `order_run.html?id=${orderId}`;

            } catch (err) {
                console.error("Error accepting:", err);
                alert("فشل القبول، قد يكون الكابتن آخر سبَقك.");
                fetchAvailableOrders();
            }
        }

        function subscribeToNewOrders() {
            supabaseClient
                .channel('driver_public_orders')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
                    fetchAvailableOrders();
                }).subscribe();
        }

        window.onload = async () => {
            if (!driverSession || driverSession.role !== 'driver') {
                window.location.href = 'login.html';
                return;
            }
            fetchAvailableOrders();
            subscribeToNewOrders();
        };
    </script>
</body>
</html>
